{% extends "base.html" %}
{% block title %}Submit Article{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 1rem auto;">
    <h1 style="font-size: 1.3rem; margin-bottom: 1rem;">Submit Article</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" required autofocus placeholder="Article title">
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="body">Body</label>
            <textarea name="body" id="body" rows="8" placeholder="Article content..."></textarea>
        </div>
        <button type="submit" class="btn">Submit</button>
        <a href="/" class="btn btn-outline" style="margin-left: 0.5rem;">Cancel</a>
    </form>
    <p class="muted" style="margin-top: 1rem;">
        The article will be automatically embedded via the configured embeddings API for semantic search.
    </p>
</div>
{% endblock %}
