{% extends "base.html" %}
{% block title %}Register — {{ site.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:2rem auto">
    <h2>Customer Registration</h2>
    {% if errors %}
    <div class="errors"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
    {% endif %}
    <form method="post" action="/auth/customer/register">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="org_slug">Organization</label>
            <input type="text" id="org_slug" name="org_slug" required placeholder="e.g. acme">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="display_name">Display Name</label>
            <input type="text" id="display_name" name="display_name" required>
        </div>
        <div class="form-group">
            <label for="password">Password (min 8 characters)</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p style="margin-top:1rem;font-size:0.875rem">Already have an account? <a href="/auth/customer/login">Login</a></p>
</div>
{% endblock %}
