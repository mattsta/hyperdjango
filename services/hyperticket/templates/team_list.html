{% extends "base.html" %}
{% block title %}Teams — {{ site.name }}{% endblock %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h2>Teams</h2>
</div>
<div class="card">
    <table>
        <thead><tr><th>Name</th><th>Slug</th><th>Lead</th><th>Active</th></tr></thead>
        <tbody>
            {% for team in teams %}
            <tr>
                <td>{{ team.name }}</td>
                <td>{{ team.slug }}</td>
                <td>{{ team.lead_agent_id or "—" }}</td>
                <td>{{ "Yes" if team.is_active else "No" }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
