{% extends "base.html" %}
{% block title %}Agent Login — {{ site.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:2rem auto">
    <h2>Agent Login</h2>
    {% if errors %}
    <div class="errors"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
    {% endif %}
    <form method="post" action="/auth/agent/login">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="org_slug">Organization</label>
            <input type="text" id="org_slug" name="org_slug" required placeholder="e.g. acme">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>
{% endblock %}
