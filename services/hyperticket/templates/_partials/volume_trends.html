<table>
    <thead><tr><th>Date</th><th>Tickets Created</th></tr></thead>
    <tbody>
        {% for d in days %}
        <tr>
            <td>{{ d.day }}</td>
            <td>
                <div style="display:flex;align-items:center;gap:0.5rem">
                    <div style="background:#1a73e8;height:1rem;width:{{ d.count * 10 }}px;max-width:200px;border-radius:2px"></div>
                    {{ d.count }}
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
