{% extends "base.html" %}
{% block title %}API Key Created — {{ site.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px">
    <h2>API Key Created</h2>
    <div style="background:#ecfdf5;border:1px solid #6ee7b7;padding:1rem;border-radius:6px;margin:1rem 0">
        <p style="font-weight:600;margin-bottom:0.5rem">Save this key now — it won't be shown again!</p>
        <code style="display:block;background:#fff;padding:0.75rem;border-radius:4px;font-size:0.875rem;word-break:break-all">{{ new_key }}</code>
    </div>
    <p>Name: <strong>{{ key_name }}</strong></p>
    <a href="/admin/api-keys/" class="btn btn-primary">Back to API Keys</a>
</div>
{% endblock %}
