{% extends "base.html" %}

{% block title %}Error — {{ site.name }}{% endblock %}

{% block content %}
<div class="error-page">
    <h1>500 — Something went wrong</h1>
    <p>An unexpected error occurred. Please try again later.</p>
    {% if debug and error %}
    <pre style="background:#f5f5f5;padding:16px;overflow-x:auto;font-size:13px;">{{ error }}</pre>
    {% endif %}
    <a href="/">Back to front page</a>
</div>
{% endblock %}
