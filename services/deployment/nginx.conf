# HyperDjango nginx reverse proxy configuration.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/myapp
#   sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: Use certbot for Let's Encrypt:
#   sudo certbot --nginx -d myapp.com

upstream hyperdjango {
    server 127.0.0.1:8000;

    # For multiple instances behind a load balancer:
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;

    keepalive 32;
}

server {
    listen 80;
    server_name myapp.com;

    # Redirect HTTP to HTTPS (uncomment after TLS setup)
    # return 301 https://$host$request_uri;

    # --- Proxy to HyperDjango ---

    location / {
        proxy_pass http://hyperdjango;
        proxy_http_version 1.1;

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering — off for SSE/streaming
        proxy_buffering off;
    }

    # --- Health check for load balancer ---

    location /health {
        proxy_pass http://hyperdjango;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Static files (if serving from nginx) ---

    # location /static/ {
    #     alias /path/to/your/app/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # --- Security headers ---

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Request limits ---

    client_max_body_size 10m;
}

