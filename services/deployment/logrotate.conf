# HyperDjango log rotation.
#
# Install:
#   sudo cp logrotate.conf /etc/logrotate.d/hyperdjango
#
# When using systemd, logs go to journald by default.
# This config is for apps using `hyper start` with file-based logging.

/var/log/hyperdjango/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    sharedscripts
    postrotate
        # Signal the app to reopen log files
        systemctl reload hyperdjango-myapp 2>/dev/null || true
    endscript
}
