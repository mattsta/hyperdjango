# External-proxy mTLS topology (alternative to the in-process terminator).
#
# nginx verifies client certificates against the private CA and forwards the
# verified identity to the app. The app honors these headers ONLY when the
# X-Hyper-MTLS-Attest value matches its MTLS_PROXY_SECRET setting
# (constant-time compare) — set the same random value in both places:
#
#   app:   HYPER_MTLS_PROXY_SECRET=<random-64-hex>   (server.env)
#   nginx: proxy_set_header X-Hyper-MTLS-Attest "<random-64-hex>";
#
# The app's plain HTTP port must be reachable only from this proxy
# (loopback or a private interface + firewall).

# Stock nginx has no $ssl_client_s_dn_cn variable — referencing it makes nginx
# refuse to start. Derive the CN from the full subject DN with a map, which must
# live at http {} level (NOT inside server/location). This file is an include
# fragment: place the map block in your http {} context (e.g. conf.d/), or lift
# it there if you inline this server block.
#
#   map $ssl_client_s_dn $ssl_client_cn {
#       ~CN=(?<cn>[^,]+)  $cn;
#       default           "";
#   }
map $ssl_client_s_dn $ssl_client_cn {
    ~CN=(?<cn>[^,]+)  $cn;
    default           "";
}

server {
    listen 8443 ssl;
    server_name secrets.internal;

    # Server identity (issue with: provision cert issue secrets.internal
    #   --server --dns secrets.internal --ca-dir /etc/hypersecret/ca ...)
    ssl_certificate     /etc/hypersecret/tls/server.crt;
    ssl_certificate_key /etc/hypersecret/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Required client certificates, anchored at the private CA.
    ssl_client_certificate /etc/hypersecret/ca/ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       1;

    location / {
        proxy_pass http://127.0.0.1:8960;
        proxy_http_version 1.1;

        # Strip anything a client may have sent, then forward the verified
        # identity. $ssl_client_cn is the certificate CN (mapped from the subject
        # DN above) == the HyperSecret identity name.
        proxy_set_header X-Hyper-MTLS-Attest      "REPLACE-WITH-MTLS_PROXY_SECRET";
        proxy_set_header X-Hyper-MTLS-CN          $ssl_client_cn;
        # NOTE: nginx's built-in $ssl_client_fingerprint is SHA-1, but the
        # in-process terminator and per-identity certificate PINNING use the
        # SHA-256 of the DER. To pin certificates behind this proxy, forward a
        # SHA-256 fingerprint instead (e.g. via an njs/Lua map computing
        # SHA-256 over $ssl_client_raw_cert). SHA-1 here is fine ONLY for
        # audit display, never for pinning.
        proxy_set_header X-Hyper-MTLS-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-Real-IP                $remote_addr;
        proxy_set_header X-Forwarded-For          "";

        # WebSocket upgrade passthrough (HyperManager live feed).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
