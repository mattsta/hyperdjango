site_name: HyperDjango
site_description: Hypermodern web framework with native Zig performance
site_url: https://mattsta.github.io/hyperdjango/
repo_url: https://github.com/mattsta/hyperdjango
repo_name: mattsta/hyperdjango
edit_uri: edit/main/docs/
copyright: HyperDjango &mdash; Hypermodern web framework with native Zig performance.

exclude_docs: |
  internal/
  _overrides/

theme:
  name: material
  custom_dir: docs/_overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mattsta/hyperdjango
      name: HyperDjango on GitHub

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/htmx-bootstrap.js
  - https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: getting-started.md
    - Clone and Run a Service: running-services.md
    - Tutorial: tutorial.md
    - Architecture: architecture.md
    - Patterns & Best Practices: patterns.md
  - Core:
    - Models & ORM: models.md
    - Database: database.md
    - Views: views.md
    - Routing: routing.md
    - Templates: templates.md
    - Middleware: middleware.md
    - Server: server.md
    - Validation: validation.md
  - ORM:
    - Lookups & Transforms: lookups.md
    - Custom Lookups: custom-lookups.md
    - Expressions & Aggregation: expressions.md
    - Transactions: transactions.md
    - Multi-Database: multi-db.md
    - Legacy Databases: legacy-databases.md
    - Pagination: pagination.md
    - Migrations: migrations.md
    - Mixins: mixins.md
    - Query Cache: query-cache.md
    - Compiled SQL Cache: orm-sql-cache.md
    - Batch Writer & TTL Cache: batch-writer.md
    - Custom Fields: fields.md
